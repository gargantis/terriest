<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- No viewport-fit=cover yet: the browser keeps the page inside the safe-area
         insets (D-30). M4's phone layout opts in, and then pads every message and
         frames the pitch inside the insets itself. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <!-- An empty icon: otherwise Firefox asks for favicon.ico, which isn't shipped (M0). -->
    <link rel="icon" href="data:," />
    <title>terriest</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body { background: #1d2b1f; color: #eef3ea; font: 16px/1.5 system-ui, sans-serif; }
      #fallback { max-width: 40rem; padding: 1rem 1.5rem; }
      #fallback code {
        font: 0.9em/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        background: #2f4232; padding: 0.1em 0.3em; border-radius: 3px; overflow-wrap: anywhere;
      }
      /* The pitch fills the window (D-30), shown once the app has started:
         until then its landmark is hidden, from assistive technology too. */
      #pitch canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      html:not([data-boot="started"]) #pitch { visibility: hidden; }
    </style>
  </head>
  <body>
    <!-- PLAN D-30: a message by default, so the page is never blank. public/boot.js
         replaces it with a failure's own, or takes it down once the app has started. -->
    <main id="fallback">
      <h1 id="fallback-title" tabindex="-1">Loading terriest…</h1>
      <p id="fallback-note">If this message doesn't go away, the page's scripts may be blocked.</p>
      <noscript><p>terriest needs JavaScript, which is off for this page.</p></noscript>
    </main>
    <script src="./boot.js"></script>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
