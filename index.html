<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: the pitch fills a phone's whole screen, round a notch and
         a home bar too, and the page keeps its text and buttons inside the safe-area
         insets itself (D-30, M4's design §5.13): the boot messages below, and each
         screen, the HUD and the touch controls in their own styles. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <!-- The icons, each linked relatively so the site works from a subpath (L232). In
         the tab: favicon.svg, which shows a light outline on a dark tab, where an engine
         takes SVG icons, and favicon.ico, at 16, 32 and 48 px, where it doesn't; the
         ICO's sizes say 32x32, not any, so an engine that takes both picks the SVG, as
         the common recipe has it. On a phone's home screen: apple-touch-icon.png,
         180 × 180 and full bleed, since iOS fills a transparent one with black. -->
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- The link previews (the owner's request of 2026-11-23): what a chat app or a social
         site shows for a pasted link to the game, its title, description and card, from
         Open Graph's tags and X's card, with the canonical address and the theme colour,
         the page's own ground. Their URLs are absolute, on the site's own address, since an
         unfurler reads this page alone and resolves nothing against where it was served
         from. The page itself never requests them, so it still works from a subpath
         (L232). The card, og.png, 1200 × 630, is drawn by the logo page (dev/logo.html). -->
    <meta name="description" content="Two packs of small dogs corral a giant rubber ball into goals. Play in your browser against bots, or with friends by link, up to 4 a side." />
    <meta property="og:title" content="terriest" />
    <meta property="og:description" content="Two packs of small dogs corral a giant rubber ball into goals. Play in your browser against bots, or with friends by link, up to 4 a side." />
    <meta property="og:site_name" content="terriest" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://terriest.com/" />
    <meta property="og:image" content="https://terriest.com/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A cream terrier in a blue bandana trots beside the name terriest. Below it: Two packs of small dogs. One giant ball." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image:alt" content="A cream terrier in a blue bandana trots beside the name terriest. Below it: Two packs of small dogs. One giant ball." />
    <meta name="theme-color" content="#1d2b1f" />
    <link rel="canonical" href="https://terriest.com/" />
    <title>terriest</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body { background: #1d2b1f; color: #eef3ea; font: 16px/1.5 system-ui, sans-serif; }
      /* The boot page's messages, inside the safe-area insets (D-30, §5.13). */
      #fallback {
        max-width: 40rem;
        padding: calc(1rem + env(safe-area-inset-top, 0px)) calc(1.5rem + env(safe-area-inset-right, 0px))
          calc(1rem + env(safe-area-inset-bottom, 0px)) calc(1.5rem + env(safe-area-inset-left, 0px));
      }
      #fallback code {
        font: 0.9em/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        background: #2f4232; padding: 0.1em 0.3em; border-radius: 3px; overflow-wrap: anywhere;
      }
      /* The app's landmark, <main id="app">, which src/main.ts makes on the normal
         page only (M4-Q1), is hidden until the app has started, from assistive
         technology too. The stage's canvas fills the window (D-30), its box shown
         only on Pre-match and Match (M4-Q9), and there the screen covers the
         canvas's box exactly, so the marks placed in CSS px from the canvas's top
         left land on it; every other screen is in the page's flow. */
      html:not([data-boot="started"]) #app { visibility: hidden; }
      #stage canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      /* Over the pitch a thumb never pans or zooms the page, so taps and the stick act at once
         (§5.13); a panel that scrolls still scrolls. */
      #app.pitch #screen { position: fixed; inset: 0; touch-action: none; }
    </style>
  </head>
  <body>
    <!-- PLAN D-30: a message by default, so the page is never blank. public/boot.js
         replaces it with a failure's own, or takes it down once the app has started. -->
    <main id="fallback">
      <h1 id="fallback-title" tabindex="-1">Loading terriest…</h1>
      <p id="fallback-note">If this message doesn't go away, the page's scripts may be blocked.</p>
      <noscript><p>terriest needs JavaScript, which is off for this page.</p></noscript>
    </main>
    <script src="./boot.js"></script>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
